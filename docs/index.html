<style>
:root{
  --bg:#1B1C1F; --card:#24262A; --card2:#2C2F34; --line:#3A3D43;
  --tx:#E6E4E1; --tx2:#A5A29D; --acc:#4A9EFF; --ok:#3FC08A; --warn:#E8A33D; --bad:#E2685F;
  --paper:#1F2125; --paperTx:#E6E4E1; --paperTx2:#A5A29D;
  --fs:19px; --lh:1.85; --pagew:720px; --ff:"Noto Serif CJK SC","Songti SC","SimSun",Georgia,serif;
  --ps:.85em; --ls:.02em; --ind:0em; --padx:32px;
  --tap:34px; --ui:1;
}
html[data-theme="light"]{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#E9EBEF; --line:#D6D9DF;
  --tx:#1D1F23; --tx2:#5E646D; --acc:#1668C4;
  --paper:#FFFFFF; --paperTx:#22252B; --paperTx2:#5E646D;
}
html[data-theme="sepia"]{
  --bg:#EDE3CE; --card:#F7F0E0; --card2:#E8DBC0; --line:#D6C6A6;
  --tx:#3A3227; --tx2:#6F6150; --acc:#9A5B2C;
  --paper:#FAF3E3; --paperTx:#3B3226; --paperTx2:#6F6150;
}
html[data-theme="green"]{
  --bg:#E4EDDD; --card:#F4F8EF; --card2:#DCE7D3; --line:#C6D5BB;
  --tx:#25301D; --tx2:#5B6B50; --acc:#3E7C4C;
  --paper:#F3F8EC; --paperTx:#26301D; --paperTx2:#5B6B50;
}
html[data-theme="gray"]{
  --bg:#20262E; --card:#2A323C; --card2:#333C48; --line:#43505F;
  --tx:#DEE5EE; --tx2:#9BA7B6; --acc:#69A8F5;
  --paper:#252D37; --paperTx:#DEE5EE; --paperTx2:#9BA7B6;
}
html[data-theme="black"]{
  --bg:#000000; --card:#0E0E10; --card2:#17171A; --line:#2A2A2E;
  --tx:#C9C9CC; --tx2:#85858A; --acc:#5AA9FF;
  --paper:#000000; --paperTx:#C4C4C8; --paperTx2:#7E7E84;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
  font-size:calc(14px * var(--ui)); line-height:1.5; overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;min-height:var(--tap);white-space:nowrap}
button:hover{border-color:var(--acc);color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{filter:brightness(1.12);color:#fff}
button.ghost{background:transparent}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
input[type=text],input[type=search],input[type=number],input[type=password],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:var(--tap);outline:none}
input:focus,select:focus{border-color:var(--acc)}
input[type=range]{accent-color:var(--acc);height:var(--tap);min-width:90px}
#app{height:100dvh;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
#webTip{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:.82em;line-height:1.45;
  background:linear-gradient(90deg,rgba(74,158,255,.16),rgba(74,158,255,.05));color:var(--tx2);
  border-bottom:1px solid var(--line)}
#webTip[hidden]{display:none}
#webTip span{flex:1;min-width:0}
#webTip b{color:var(--tx);font-weight:600}
#webTip a{color:var(--acc);text-decoration:none;white-space:nowrap}
#webTip a:hover{text-decoration:underline}
#webTip button{min-height:24px;padding:1px 7px;font-size:1.15em;line-height:1;background:transparent;border-color:transparent;color:var(--tx2)}
.brand{font-size:1.25em;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.brand small{font-size:.55em;font-weight:400;color:var(--tx2);letter-spacing:.05em;margin-left:8px}
.acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* 「⋯ 更多」只在窄屏出现，宽屏所有按钮本来就排得下 */
.only-narrow{display:none}
.spacer{flex:1 1 auto}
.hint{color:var(--tx2);font-size:.86em}
/* ---------- 书架 ---------- */
#libBody{flex:1;min-height:0;overflow-y:auto;padding:18px}
.shelf{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));max-width:1300px;margin:0 auto}
.bk{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.bk:hover{transform:translateY(-3px);border-color:var(--acc)}
.bk .cv{height:196px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bk .cv img{width:100%;height:100%;object-fit:cover}
.bk .cv .ph{font-size:2.2em;opacity:.35;font-family:var(--ff);line-height:1.2;text-align:center;padding:12px;word-break:break-all}
.bk .meta{padding:9px 10px 11px}
.bk .nm{font-weight:600;font-size:.95em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.7em}
.bk .sub{color:var(--tx2);font-size:.78em;margin-top:5px;display:flex;gap:6px;align-items:center}
.bk .bar{height:4px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
.bk .bar i{display:block;height:100%;background:var(--acc)}
.bk .del{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:8px;padding:0;min-height:28px;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:15px;opacity:0}
.bk:hover .del{opacity:1}
.bk .resume{display:block;width:100%;margin-top:8px;padding:5px 8px;min-height:30px;font-size:.8em;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--acc);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .resume:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{font-size:.7em;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--tx2)}
.empty{max-width:560px;margin:9vh auto;text-align:center;color:var(--tx2);line-height:2}
.empty .big{font-size:3em;opacity:.4;font-family:var(--ff)}
.foot{flex:0 0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;background:var(--card);border-top:1px solid var(--line);color:var(--tx2);font-size:.84em}
/* ---------- 阅读器 ---------- */
#readTop{padding:8px 12px}
#readTitle{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#readMain{flex:1;min-height:0;display:flex}
.side{width:290px;flex:0 0 auto;background:var(--card);border-right:1px solid var(--line);display:none;flex-direction:column;min-height:0}
.side.on{display:flex}
.side .tabs{display:flex;gap:4px;padding:9px;border-bottom:1px solid var(--line);flex:0 0 auto}
.side .tabs button{flex:1;padding:6px 4px;font-size:.86em}
.side .tabs button.sideX{flex:0 0 auto;width:27px;padding:6px 0;font-size:1.08em;line-height:1;background:transparent;border-color:transparent;color:var(--tx2)}
.side .tabs button.sideX:hover{color:var(--bad);border-color:var(--line)}
/* 正文必须能选中：桌面外壳默认把 user-select 关掉，会连带把划线批注一起废掉 */
#page,#page *{-webkit-user-select:text;user-select:text}
.side .body,.noteIt{-webkit-user-select:text;user-select:text}
.side .body{flex:1;min-height:0;overflow-y:auto;padding:8px}
.side .it{display:block;width:100%;text-align:left;background:transparent;border:none;border-radius:7px;padding:8px 9px;margin-bottom:2px;color:var(--tx);font-size:.9em;white-space:normal;line-height:1.45}
.side .it:hover{background:var(--card2);color:var(--acc)}
.side .it.cur{background:var(--card2);color:var(--acc);font-weight:600}
.side .it.lv1{padding-left:22px;font-size:.86em;color:var(--tx2)}
.side .it.lv2{padding-left:36px;font-size:.82em;color:var(--tx2)}
.side .q{width:100%;margin-bottom:9px}
#pageWrap{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;background:var(--bg);position:relative}
/* 自动滚动时关掉平滑滚动，否则每帧设置 scrollTop 会被动画吃掉 */
body.autoscroll #pageWrap{scroll-behavior:auto}
#page{max-width:var(--pagew);margin:0 auto;padding:34px var(--padx) 70px;background:var(--paper);color:var(--paperTx);
  font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);min-height:100%;letter-spacing:var(--ls)}
#page h1,#page h2,#page h3,#page h4{line-height:1.4;margin:1.4em 0 .7em;font-weight:700;text-align:left}
#page h1{font-size:1.5em}#page h2{font-size:1.28em}#page h3{font-size:1.12em}
/* 段落排版：带上 html[data-mode] 提高权重，保证用户的段距/缩进能压过书自带样式 */
html[data-mode] #page p,html[data-mode] #page .rdp{margin:0 0 var(--ps);text-align:justify;text-indent:var(--ind)}
#page .rdh{font-weight:700;font-size:1.16em;margin:1.3em 0 .7em;text-align:left}
#page img,#page svg{max-width:100%;height:auto;display:block;margin:12px auto}
/* 点插图看大图 */
#page img{cursor:zoom-in}
#imgView{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.86);cursor:zoom-out;padding:16px}
#imgView.on{display:flex}
#imgView img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain;
  box-shadow:0 18px 60px rgba(0,0,0,.6);border-radius:4px}
#imgView .ivTip{position:absolute;bottom:14px;left:0;right:0;text-align:center;
  color:#C9C9C9;font-size:.8em;pointer-events:none}
#page blockquote{border-left:3px solid var(--acc);padding-left:14px;margin:1em 0;color:var(--paperTx2)}
#page a{color:var(--acc);cursor:pointer;text-decoration:underline}
#page .rdp{border-left:3px solid transparent;margin-left:-15px;padding-left:12px;border-radius:3px}
#page .rdp.speaking{background:rgba(74,158,255,.15);border-left-color:var(--acc)}
#page .rdp.hit{background:rgba(232,163,61,.28)}
#chTitle{font-size:1.35em;font-weight:700;margin:0 0 1.1em;padding-bottom:.5em;border-bottom:1px solid var(--line);font-family:var(--ff)}
#chEnd{text-align:center;padding:26px 0 8px;color:var(--paperTx2);font-size:.85em}
/* 书自带、与顶栏标题重复的那行标题 */
#page .dupH{display:none}
#readFoot{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--card);border-top:1px solid var(--line)}
#progRange{flex:1;min-width:80px}
/* 朗读条 */
.speakbar{display:none;flex:0 0 auto;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 13px;background:var(--card2);border-top:2px solid var(--acc)}
.speakbar.on{display:flex}
.speakbar .grp{display:flex;gap:5px;align-items:center}
.speakbar select{max-width:190px}
.speakbar #spVoice{max-width:250px}
.speakbar #spNow{color:var(--tx2);font-size:.84em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 180px}
.spdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.2s infinite}
.spwho{color:var(--acc);font-weight:600;margin-right:6px}
.spwho::before{content:"「"}.spwho::after{content:"」"}
.vq{font-size:.8em;padding:3px 8px;border-radius:10px;white-space:nowrap;cursor:pointer;border:1px solid transparent;flex:0 0 auto}
.vq.good{color:#7ee0a8;background:rgba(46,190,110,.13);border-color:rgba(46,190,110,.35)}
.vq.mid{color:#e8c46a;background:rgba(232,163,61,.12);border-color:rgba(232,163,61,.30)}
.vq.bad{color:#e79a9a;background:rgba(220,90,90,.12);border-color:rgba(220,90,90,.30)}
@keyframes pulse{50%{opacity:.25}}
html[data-motion="low"] *{animation:none!important;transition:none!important}
/* 弹层 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(680px,100%);max-height:86dvh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.mbox .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;flex:0 0 auto}
.mbox .mb{padding:16px;overflow-y:auto;line-height:1.8}
.mbox .mf{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.mbox h3{margin:1.2em 0 .5em;font-size:1.05em}
.mbox h3:first-child{margin-top:0}
.mbox p{margin:.5em 0}
.mbox ul{padding-left:1.4em;margin:.5em 0}
.mbox .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.mbox .row label{min-width:76px;color:var(--tx2)}
.mbox .seg{display:flex;gap:5px;flex-wrap:wrap}
.mbox .kv{color:var(--tx2);font-size:.9em}
.mbox code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:.9em}
/* 拖文件进来时的提示层 */
#dropHint{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(20,22,26,.62);backdrop-filter:blur(2px)}
#dropHint.on{display:flex}
#dropHint .dh{padding:26px 34px;border-radius:14px;border:2px dashed var(--acc);
  background:var(--card);color:var(--tx);text-align:center;box-shadow:0 18px 46px rgba(0,0,0,.5)}
#dropHint .dh b{display:block;font-size:1.16em;margin-bottom:6px;color:var(--acc)}
#dropHint .dh span{font-size:.9em;color:var(--tx2)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;display:none;max-width:86vw;text-align:center;font-size:.9em}
#toast.on{display:block}
.docnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.docnav button{padding:5px 10px;min-height:30px}
/* ---------- 检查更新 ---------- */
.updList{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.updList .updGo{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:11px 14px;min-height:46px;text-align:left;font-size:.95em;border-radius:10px}
.updList .updGo.pri{border-color:var(--acc);background:transparent;color:var(--tx);font-weight:600}
.updList .updGo.pri:hover{background:transparent;color:var(--tx);filter:none;border-color:var(--acc)}
.updMore{margin:12px 0 4px;border-top:1px solid var(--line);padding-top:10px}
.updMore>summary{cursor:pointer;color:var(--tx2);font-size:.9em;padding:4px 0;outline:none}
.updMore>summary:hover{color:var(--tx)}
/* ---------- 书架分组条 ---------- */
#shelfBar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 14px;background:var(--card);
  border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#shelfBar::-webkit-scrollbar{display:none}
#shelfBar .chip{flex:0 0 auto;padding:4px 11px;min-height:28px;font-size:.84em;border-radius:14px;background:transparent;color:var(--tx2)}
#shelfBar .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#shelfBar .chip .n{opacity:.6;margin-left:4px;font-size:.9em}
#shelfBar .add{border-style:dashed}
/* ---------- 批量操作条 ---------- */
#selBar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--card2);
  border-bottom:1px solid var(--line);font-size:.86em;flex-wrap:wrap}
#selBar[hidden]{display:none}
/* ---------- 书架卡片新增控件 ---------- */
.bk .fav{position:absolute;left:6px;top:6px;width:28px;height:28px;border-radius:8px;padding:0;min-height:28px;
  background:rgba(0,0,0,.5);border:none;color:#fff;font-size:15px;opacity:0;line-height:1}
.bk:hover .fav,.bk .fav.on{opacity:1}
.bk .fav.on{color:#FFC53D;background:rgba(0,0,0,.62)}
.bk .more{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:8px;padding:0;min-height:28px;
  background:rgba(0,0,0,.55);border:none;color:#fff;font-size:15px;opacity:0;line-height:1}
.bk:hover .more{opacity:1}
.bk .del{display:none}
.bk .kn{position:absolute;left:6px;bottom:6px;font-size:.7em;padding:1px 6px;border-radius:8px;
  background:rgba(0,0,0,.6);color:#fff;line-height:1.5;pointer-events:none}
.bk .chk{position:absolute;left:7px;top:7px;width:22px;height:22px;border-radius:6px;border:2px solid #fff;
  background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;color:#fff;font-size:13px;line-height:1}
body.selmode .bk .chk{display:flex}
body.selmode .bk .fav,body.selmode .bk .more{display:none}
body.selmode .bk.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
body.selmode .bk.sel .chk{background:var(--acc);border-color:var(--acc)}
body.selmode .bk .resume{pointer-events:none}
/* ---------- 正文高亮 / 批注 ---------- */
#page mark{background:rgba(255,214,102,.42);color:inherit;border-radius:2px;padding:0 .06em;cursor:pointer}
#page mark.hl-g{background:rgba(122,214,140,.36)}
#page mark.hl-b{background:rgba(122,178,255,.34)}
#page mark.hl-p{background:rgba(255,150,196,.34)}
#page mark.hasNote{border-bottom:1.5px solid rgba(255,214,102,.95)}
#page mark.hl-g.hasNote{border-bottom-color:rgba(122,214,140,.95)}
#page mark.hl-b.hasNote{border-bottom-color:rgba(122,178,255,.95)}
#page mark.hl-p.hasNote{border-bottom-color:rgba(255,150,196,.95)}
html[data-theme="light"] #page mark{background:rgba(255,214,102,.62)}
html[data-theme="light"] #page mark.hl-g{background:rgba(122,214,140,.55)}
html[data-theme="light"] #page mark.hl-b{background:rgba(122,178,255,.45)}
html[data-theme="light"] #page mark.hl-p{background:rgba(255,150,196,.45)}
/* 选中文字浮动工具条 */
#selTools{position:fixed;z-index:70;display:none;align-items:center;gap:4px;padding:5px 6px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:.86em}
#selTools.on{display:flex}
#selTools .sw{width:22px;height:22px;min-height:22px;border-radius:50%;padding:0;border:1.5px solid rgba(0,0,0,.15);cursor:pointer}
#selTools .sw[data-hl="y"]{background:#FFD666}
#selTools .sw[data-hl="g"]{background:#7AD68C}
#selTools .sw[data-hl="b"]{background:#7AB2FF}
#selTools .sw[data-hl="p"]{background:#FF96C4}
#selTools button.act{padding:4px 9px;min-height:26px;background:transparent;border-color:transparent;color:var(--tx)}
#selTools button.act:hover{background:var(--card2);color:var(--acc)}
#selTools .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
/* 笔记侧栏 */
.noteIt{background:var(--card2);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.noteIt:hover{outline:1px solid var(--acc)}
.noteIt .q{color:var(--tx);font-size:.9em;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.noteIt .cm{color:var(--tx2);font-size:.86em;margin-top:5px;padding-left:8px;border-left:2px solid var(--acc)}
.noteIt .ft{display:flex;gap:6px;align-items:center;margin-top:7px;color:var(--tx2);font-size:.78em}
.noteIt .ft .spacer{flex:1}
.noteIt .ft button{min-height:24px;padding:1px 7px;font-size:1em;background:transparent;border-color:transparent}
.noteIt .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.noteclr-y{background:#FFD666}.noteclr-g{background:#7AD68C}.noteclr-b{background:#7AB2FF}.noteclr-p{background:#FF96C4}
/* 阅读总结 */
.sumGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:10px 0 16px}
.sumGrid .c{background:var(--card2);border-radius:10px;padding:10px 12px;min-height:66px}
.sumGrid .c b{display:block;font-size:1.18em;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumGrid .c span{color:var(--tx2);font-size:.78em;display:block;margin-top:2px}
.sumEx{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px}
.sumEx .e{padding:7px 0;border-bottom:1px dashed var(--line)}
.sumEx .e:last-child{border-bottom:none}
.sumEx .e .t{font-size:.9em;line-height:1.6}
.sumEx .e .n{color:var(--acc);font-size:.85em;margin-top:3px}
.sumEx .e .h{color:var(--tx2);font-size:.76em;margin-top:3px}
/* ---------- 翻页模式（分栏） ---------- */
/* 版心宽度限制放在容器上：容器居中、自己裁掉溢出；
   #page 铺满容器，多栏溢出的后续列被容器裁掉，翻页只靠 translateX。
   ⚠️ overflow:hidden 绝不能加在 #page 上——那会把平移过去的内容一起裁掉，
      翻到第 2 页之后整页空白。 */
html[data-mode="page"] #pageWrap{
  overflow:hidden;
  width:100%;
  max-width:calc(var(--pagew) * var(--pcols,1) + 60px * (var(--pcols,1) - 1));
  margin:0 auto;
}
html[data-mode="page"] #page{
  height:100%;min-height:0;margin:0;
  width:100%;max-width:none;
  overflow:visible;
  column-fill:auto;column-gap:60px;
  column-rule:1px solid rgba(128,128,128,.20);
  transform:translateX(0);will-change:transform;backface-visibility:hidden;
}
html[data-mode="page"] #page.pg-slide{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
html[data-mode="page"] #page.pg-fade{animation:pgFade .26s ease}
/* 版心是阅读器的地盘：书里的 body 样式会被映射到 #page 上，这里兜底钉死，
   否则一本书写 body{margin:5%} 就能把双栏挤出屏幕 */
html[data-mode] #page{margin:0 auto;padding:34px var(--padx) 70px;
  font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);
  font-weight:var(--fw,400);
  background:var(--paper);color:var(--paperTx)}
/* 翻页：上下留白统一走这里，底部多留一成行高，避免最后一行贴住工具栏 */
html[data-mode="page"] #page{padding:24px var(--padx) calc(24px + .9em)}
@keyframes pgFade{from{opacity:.30}to{opacity:1}}
html[data-mode="page"] #chEnd{break-inside:avoid}
/* 翻页模式：左右点击区提示 */
#pgHintL,#pgHintR{position:absolute;top:0;bottom:0;width:15%;pointer-events:none;opacity:0;transition:opacity .2s;z-index:5}
#pgHintL{left:0;background:linear-gradient(90deg,rgba(128,128,128,.16),transparent)}
#pgHintR{right:0;background:linear-gradient(270deg,rgba(128,128,128,.16),transparent)}
html[data-mode="page"] #pageWrap:hover #pgHintL,html[data-mode="page"] #pageWrap:hover #pgHintR{opacity:.55}
html[data-mode="scroll"] #pgHintL,html[data-mode="scroll"] #pgHintR{display:none}
/* ---------- 沉浸模式 ---------- */
#viewRead{position:relative}
body.imm #readTop,body.imm #readFoot{position:absolute;left:0;right:0;z-index:32;box-shadow:0 6px 26px rgba(0,0,0,.34)}
body.imm #readTop{top:0;transform:translateY(-102%);transition:transform .22s ease}
body.imm #readFoot{bottom:0;transform:translateY(102%);transition:transform .22s ease}
body.imm #readTop.peek,body.imm #readFoot.peek{transform:none}
body.imm #readMain{padding:0}
/* ---------- 亮度暗化 ---------- */
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:45;transition:opacity .18s}
/* ---------- 自动阅读胶囊 ---------- */
#autoPill{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:50;display:none;
  align-items:center;gap:8px;padding:7px 9px 7px 14px;border-radius:22px;font-size:.84em;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap}
#autoPill.on{display:flex}
#autoPill button{min-height:28px;padding:3px 10px;border-radius:14px}
#autoPill .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:6px}
/* 按钮上的状态点 */
#btnAuto.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* ---------- 排版面板 ---------- */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin:6px 0 12px}
.sw-grid .th{display:flex;flex-direction:column;gap:5px;align-items:center;padding:8px 4px;border-radius:10px;
  border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.78em;color:var(--tx2);min-height:56px}
.sw-grid .th.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sw-grid .th .sw{width:100%;height:22px;border-radius:6px;border:1px solid rgba(128,128,128,.35)}
.clrRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clrRow input[type=color]{width:34px;height:26px;min-height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--card)}
/* 字体选择：每个按钮用自己的字体渲染，挑之前先看到样子 */
.ffGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:5px;flex:1;min-width:220px}
.ffGrid button{padding:6px 4px;font-size:.92em}
/* 常用色板 */
.swRow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swDot{width:23px;height:23px;min-height:23px;padding:0;border-radius:50%;border:1px solid rgba(128,128,128,.45);cursor:pointer;flex:0 0 auto}
.swDot:hover{transform:scale(1.12)}
.swDot.on{box-shadow:0 0 0 2px var(--acc);border-color:transparent}
.tpGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px}
.tpGrid .cell{display:flex;flex-direction:column;gap:3px}
.tpGrid .cell .lb{font-size:.78em;color:var(--tx2)}
.tpGrid .cell .seg{flex-wrap:wrap}
.kbd{display:inline-block;min-width:22px;text-align:center;background:var(--card2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.86em;font-family:var(--ff)}
p.kv.kbdline{line-height:2.1}
/* ---------- 主题面板（卡片式预览） ---------- */
.thGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin:4px 0 14px}
.thCard{position:relative;display:flex;flex-direction:column;gap:5px;align-items:flex-start;
  padding:9px 10px;border-radius:11px;border:1px solid var(--line);cursor:pointer;
  text-align:left;font-size:.8em;line-height:1.3;overflow:hidden;min-height:74px}
.thCard b{font-size:.94em;opacity:.9}
.thCard .demo{font-size:.86em;opacity:.72;letter-spacing:.03em}
.thCard .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%}
.thCard .tick{position:absolute;right:8px;bottom:6px;font-size:.9em;font-weight:700;opacity:0}
.thCard.on{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}
.thCard.on .tick{opacity:1}
/* ---------- 阅读时钟 ---------- */
.clkBig{display:flex;align-items:baseline;gap:14px;padding:11px 15px;margin:2px 0 14px;border-radius:12px;
  background:var(--card2);border:1px solid var(--line)}
.clkBig b{font-size:1.7em;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clkBig span{font-size:.86em;color:var(--tx2)}
#clock{font-size:.76em;color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums;
  padding:3px 9px;border-radius:11px;background:var(--card2);border:1px solid var(--line);cursor:pointer;
  transition:color .2s,border-color .2s}
#clock:hover{color:var(--tx)}
#clock.warn{color:var(--warn);border-color:var(--warn)}
#clock.tired{color:var(--bad);border-color:var(--bad)}
#clock.off{display:none}
/* 沉浸模式顶栏收起，留一个淡时钟在右上角 */
#clockFloat{display:none;position:absolute;top:10px;right:14px;z-index:31;pointer-events:none;
  font-size:.74em;color:var(--tx2);font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:11px;
  background:rgba(0,0,0,.28);border:1px solid rgba(128,128,128,.28);opacity:.62}
body.imm #clockFloat{display:block}
/* ---------- 休息提醒 ---------- */
#restTip{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(14px);z-index:60;
  display:none;align-items:center;gap:10px;padding:11px 13px 11px 16px;border-radius:14px;font-size:.86em;
  background:var(--card2);border:1px solid var(--warn);box-shadow:0 18px 46px rgba(0,0,0,.62);max-width:min(92vw,560px)}
#restTip .rtTx{color:var(--tx);font-weight:500}
#restTip .ic{font-size:1.15em;margin-right:2px}
#restTip.on{display:flex;animation:restIn .24s ease forwards}
@keyframes restIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#restTip .rtTx{line-height:1.5}
#restTip button{min-height:30px;padding:4px 11px;border-radius:14px;white-space:nowrap}
/* 窄屏（按屏幕宽度自动） */
@media (max-width:860px){

#libTop,#readTop{gap:7px;padding:8px}
.brand{width:100%;font-size:1.1em}
.brand small{display:none}
#libSearch{width:100%;order:3}
#libTop .spacer,#readTop .spacer{display:none}
/* 顶栏先只留 5 个常用键（各占 1/5 宽、44px 高，拇指点不错），
   书签 / 笔记 / 主题 / 自动 / 全屏 / 设置这些收进「⋯」，点开再摊平。
   原来 5 列 × 3 行、36px 高、.8em 小字，拇指经常摸到隔壁。 */
#libActs,#readActs{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#libActs .sec,#readActs .sec{display:none}
#libActs.open .sec,#readActs.open .sec{display:block}
/* 展开后键多了，改 6 列：12 个正好两行排满，不会留半行空格 */
#libActs.open,#readActs.open{grid-template-columns:repeat(6,1fr)}
#libActs .only-narrow,#readActs .only-narrow{display:block}
#libActs button,#readActs button{font-size:.86em;padding:8px 2px;min-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#readTitle{max-width:100%}
#readTitle{max-width:calc(100% - 112px)}
#clock{font-size:.7em;padding:2px 6px;border-radius:9px;white-space:nowrap}
body.imm #clockFloat{font-size:.7em;top:6px;right:8px}
#restTip{bottom:60px;left:8px;right:8px;max-width:none}
#restTip.on{animation:none;transform:none}
#restTip .rtTx{font-size:.94em}
#libBody{padding:10px}
.shelf{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.bk .cv{height:142px}
.bk .meta{padding:7px}
.bk .del{opacity:1}
#readMain{position:relative}
.side{position:absolute;left:0;top:0;bottom:0;width:86vw;max-width:330px;z-index:20;box-shadow:6px 0 24px rgba(0,0,0,.35)}
#page{padding:18px min(var(--padx),18px) 60px}
html[data-mode="page"] #page{padding:14px min(var(--padx),16px)}
#page h1{font-size:1.3em}
#readFoot{padding:6px;gap:5px}
#readFoot button{padding:6px 8px;font-size:.82em}
#progTx{min-width:78px;font-size:.75em}
.speakbar{gap:6px;padding:8px}
.speakbar select{max-width:124px}
.speakbar #spVoice{max-width:min(48vw,200px)}
.speakbar #spQuality{display:none}
.speakbar #spTry{font-size:.8em;padding:5px 8px;min-height:30px}
.speakbar .spRateLabel{display:none}
.speakbar #spNow{display:none}
.mbox .mf button{flex:1}
.foot{font-size:.78em}
#autoPill{bottom:56px;font-size:.8em;padding:6px 8px 6px 11px}
#pgHintL,#pgHintR{width:24%}

}

      'When on, narration keeps your chosen voice while quoted dialogue switches per character — “Zhang said” and “Li replied” sound different, and each character keeps the same voice for the whole book. Unrecognised speakers rotate in order of appearance, so dialogue never collapses into the narration voice. Works only with the free neural voices; system voices cannot do this.',

  /* 中文侧也可能需要「统一改写」的文案：留空表示中文原样 */
  var ZH = {};

  var LANG = 'zh';

  function t(s, a) {
    var out = s;
    if (LANG === 'en') {
      if (EN[s] !== undefined) out = EN[s];
    } else if (ZH[s] !== undefined) out = ZH[s];
    if (a && typeof out === 'string' && out.indexOf('{') >= 0) {
      out = out.replace(/\{(\w+)\}/g, function (m, k) {
        return a[k] !== undefined ? a[k] : m;
      });
    }
    return out;
  }

  /* 静态界面：把 data-i18n / -ph / -title / -html 的元素刷一遍 */
  function apply(root) {
    root = root || document;
    var nl = root.querySelectorAll('[data-i18n]'), i;
    for (i = 0; i < nl.length; i++) nl[i].textContent = t(nl[i].getAttribute('data-i18n'));
    nl = root.querySelectorAll('[data-i18n-ph]');
    for (i = 0; i < nl.length; i++) nl[i].setAttribute('placeholder', t(nl[i].getAttribute('data-i18n-ph')));
    nl = root.querySelectorAll('[data-i18n-title]');
    for (i = 0; i < nl.length; i++) nl[i].setAttribute('title', t(nl[i].getAttribute('data-i18n-title')));
    nl = root.querySelectorAll('[data-i18n-html]');
    for (i = 0; i < nl.length; i++) nl[i].innerHTML = t(nl[i].getAttribute('data-i18n-html'));
    document.documentElement.setAttribute('lang', LANG === 'en' ? 'en' : 'zh-CN');
    document.title = LANG === 'en' ? 'MoYin · Read & Listen' : '墨吟 · 阅读与朗读';
  }

  function set(l) { LANG = (l === 'en' ? 'en' : 'zh'); }
  function get() { return LANG; }

  w.MYI18N = { t: t, apply: apply, set: set, get: get, EN: EN, ZH: ZH };

    help: '<h3>Import</h3>' +
      '<p>Tap <b>＋ Import</b> on the shelf to add one or more <code>.txt</code> / <code>.epub</code> files, or <b>Folder</b> to pull every TXT / EPUB out of a directory at once. Everything is stored in this device’s browser database — nothing is uploaded.</p>' +
      '<p><b>Network location</b> (desktop build): the <b>Network</b> button on the shelf accepts a LAN share such as <code>\\\\192.168.1.10\\Books</code>, a mapped drive like <code>Z:\\books</code>, or any absolute local path. It uses Windows’ own network access, with credentials remembered by the system — if File Explorer can open the folder, the reader can scan and open it directly, with no need to copy the books over first. The button stays hidden on phones.</p>' +

      '<h3>Highlights, notes and sharing</h3>' +

    voice: '<h3>Why voices can sound robotic</h3>' +
      '<p class="kv">Want natural Chinese quickly? See <b>Settings → Free neural voices</b>: install the open-source voice library once and it works offline forever, free of charge.</p>' +
      '<p>Browser speech uses the operating system engine. The built-in Windows voices (Huihui / Kangkang / Yaoyao) are old concatenative synthesis — flat pitch, hard pauses, robot-like. Voices named <code>Online (Natural)</code> are neural: they handle intonation, stress and sentence-final falls, and sound close to a human.</p>' +
      '<h3>Three options</h3><ul>' +
      '<li><b>⭐ Free offline neural voices (recommended)</b>: sherpa-onnx plus the open-source AISHELL3 multi-speaker VITS model, running on your own CPU. Near-human intonation, <b>no network, no fees, no account, no API key</b>. The model holds 174 Chinese speakers (148 female + 26 male); 11 curated voices are listed by default and role-based reading is supported. Double-click the launcher before listening.</li>' +
      '<li><b>⭐ Natural voices</b>: names containing <code>Natural</code> / <code>Neural</code>, provided by Microsoft Edge. Good quality but <b>needs a connection</b>, and the service is often unreachable from mainland China.</li>' +
      '<li><b>Local voices</b>: fully offline and instant, but clearly mechanical. Use as a fallback.</li></ul>' +
      '<p>The voice list is grouped accordingly and the badge next to it shows “● Free neural voices” or “● Local voice (robotic)”. <b>Preview</b> compares voices without touching your reading position.</p>' +
      '<h3>No natural voices listed?</h3><ol>' +
      '<li><b>Open this file in Microsoft Edge</b> (right-click → Open with). Chrome’s Chinese online voices depend on Google services, which are usually unreachable here.</li>' +
      '<li>In Edge → Settings → Languages, make sure “Chinese (Simplified)” is present. In Windows → Settings → Time &amp; language → Language &amp; region → Chinese (Simplified) → Language options → Speech, download the speech pack, then restart Edge.</li>' +
      '<li>Or skip all of this and use the free offline library, which depends on no online service.</li></ol>' +
      '<h3>Three knobs for more natural speech</h3><ul>' +
      '<li><b>Whole sentences</b> (on by default): split at sentence boundaries instead of mid-clause, so neural voices keep their prosody.</li>' +
      '<li><b>Pause between sentences</b> (120 ms by default): a little silence between sentences, doubled between paragraphs. Adjustable 0–600 ms in Settings → Reading aloud.</li>' +
      '<li><b>Speed 0.9–1.1×</b>: the comfortable range for Chinese; faster eats the expression, slower drags.</li></ul>' +
      '<h3>Privacy</h3><p>With the offline library or local system voices, speech is produced entirely on this machine — <b>no outbound requests at all</b>, not a single character leaves your computer. Only when you deliberately pick an <code>Online (Natural)</code> voice does the browser send the sentence being spoken to Microsoft for synthesis; that is the browser engine’s behaviour, and this app uploads no books, progress or settings.</p>' +
      '<p>If an online voice fails, the app falls back to a local voice and tells you, never hanging. Voice availability and quality vary by device and installed language packs.</p>' +
      '<h3>Preview silent or falling back?</h3>' +
      '<p>Online neural voices need <code>speech.platform.bing.com</code>. That domain is blocked or throttled on some networks (mainland China additionally requires a short-lived token), which shows up as silence. It is neither the book nor this app — the offline library sidesteps it completely.</p><ul>' +
      '<li>Route <code>speech.platform.bing.com</code> through a working proxy / accelerator (global mode), then hit <b>Preview</b>.</li>' +
      '<li>Try another network (a phone hotspot, for example) or another time of day.</li>' +
      '<li>Or stop fighting the network and use <b>Free neural voices</b>, which work offline forever.</li></ul>',

    local: '<h3>What this is</h3>' +
      '<p>A <b>completely free, completely offline</b> Chinese neural speech option: the open-source <code>sherpa-onnx</code> engine (Apache-2.0) plus the open-source Chinese multi-speaker VITS model <code>AISHELL3</code>. Intonation, pauses and stress are close to a human — a different league from the built-in Windows voices.</p>' +
      '<p>Synthesis runs <b>on your own computer</b>: no sign-up, no API key, no network, no per-character billing, not one byte of the book is sent anywhere.</p>' +
      '<h3>Two steps to listen</h3><ol>' +
      '<li>Open the bundled <code>VoicePack</code> folder and double-click <code>启动语音引擎.cmd</code> (the launcher). It starts a small local service and opens the reader in Edge. <b>Nothing to download, install or fill in.</b> The English-named <code>START.cmd</code> in the same folder runs the same script.</li>' +
      '<li>When the badge in the reading bar turns green — “● Free neural voices” — it is connected. Hit <b>Preview voice</b> to confirm sound. Closing that window stops the service and the app falls back to system voices; reading is unaffected.</li></ol>' +
      '<p class="kv">Moving to another computer: copy the whole <code>VoicePack</code> folder (engine and model already inside, about 53 MB). If you only copy the scripts, run <code>安装语音包.cmd</code> on the new machine to download the same files (about 53 MB, from a China-friendly mirror, chunked and parallel). The Windows voice library cannot be reused on other systems. <b>The full Windows EXE has the library appended inside the executable</b>: copy that single file (about 47 MB) and you can listen immediately; it unpacks to the local cache on first run.</p>' +
      '<h3>Built-in voices · 174 Chinese speakers (148 female + 26 male)</h3>' +
      '<p>One model contains 174 different Chinese speakers. The dropdown lists the <b>11 hand-picked, named</b> voices by default; to hear more, open <b>Settings → Free neural voices → Voice range</b> and choose “All 174”. The list is then sorted into seven pitch bands (low / mid / bright male; low / mid / clear / high female). Use <b>Preview voice</b> to compare, or switch directly from the dropdown at the left of the reading bar — while reading, the current paragraph restarts with the new voice. Everything is offline neural speech and real-time on an ordinary CPU.</p>' +
      '<p><b>Why 174 voices cost no space</b>: they all come from the same 29 MB AISHELL3 multi-speaker model — switching only changes a <code>--sid</code> index. The official model ships numbers without nicknames; the “low / clear / bright” labels come from each speaker’s measured median pitch (F0) and exist only to help you tell them apart. <b>Preview and pick the one you like.</b></p>' +
      '<p class="kv">For long novels the default “Voice 12” (warm, slightly low) is a good start; try “Voice 160” or “Voice 150” for something brighter, “Voice 110” for a male voice. Synthesis is fast (about one second for a 4–7 second sentence). Only installed voices are listed; missing files are hidden automatically.</p>' +
      '<h3>Role-based reading (a different voice per character)</h3>' +
      '<p>Turn on <b>Multi-voice</b> in the reading bar, or in <b>Settings → Multi-voice dialogue</b>: <b>narration keeps your chosen voice, while quoted dialogue switches per character</b>. Each character keeps the same voice for the whole book, and different characters never collide; when a name cannot be recognised, voices rotate in order of appearance so dialogue never merges into the narration.</p>' +
      '<p>The character voice pool can be <i>mixed</i>, <i>female only</i> or <i>male only</i>. <b>Preview</b> in settings reads a short passage with dialogue so you can hear the difference immediately. Toggling while reading takes effect at once and restarts the current paragraph.</p>' +
      '<p class="kv">Works only with the free neural voices — a system voice can only produce one voice at a time. The narration voice is whatever you selected; to change the most frequent character, change the narration voice (the character pool automatically avoids it).</p>' +
      '<h3>How it works</h3>' +
      '<p>The launcher starts an HTTP service on <code>127.0.0.1</code> (Python standard library only, no third-party dependencies). The reader sends <b>the sentence being spoken</b>, the service renders a WAV and returns it for playback, and the next sentence is prefetched so playback feels gapless. The service never listens on external interfaces, writes no logs and collects nothing.</p>' +
      '<p><code>VoicePack</code> is self-contained: <code>tts_server.py</code> uses only the standard library, and <code>安装语音包.cmd</code> downloads open-source files from their official release pages only when you run it. It touches no registry, installs no system component and starts nothing at boot; deleting the whole folder does not affect the reader.</p>' +
      '<h3>Not connecting / no sound</h3><ul>' +
      '<li>Badge stuck at “● Local voice”: the engine is not running. Double-click the launcher, then hit <b>Recheck</b> in Settings.</li>' +
      '<li>Port already in use: change the port in Settings; keep the launcher and the reader consistent.</li>' +
      '<li>Missing model: run <code>安装语音包.cmd</code> again and wait for it to finish.</li>' +
      '<li>A 1–2 second delay on the first sentence is the model loading; later sentences are much faster. On older machines, reduce the pause between sentences.</li>' +
      '<li>Any failure falls back to system voices automatically — nothing hangs, no progress is lost.</li></ul>' +
      '<h3>License</h3><p><code>sherpa-onnx</code> (Apache-2.0) and the <code>AISHELL3</code> Chinese multi-speaker VITS model are open-source projects used under their own licenses. They are bundled only to be called locally; this reader does not modify them, install system components or redistribute them over the network.</p>',

    faq: '<h3>Reading sounds robotic?</h3><p>Use the free offline voice library that ships with the app: double-click <code>VoicePack/启动语音引擎.cmd</code> — nothing to download, fully offline, free, no account. See <b>Free neural voices</b>. You can also open the file in Microsoft Edge and pick a voice from the “⭐ Natural voices” group.</p>' +
      '<h3>Does it cost money? Do I need an account?</h3><p>No and no. The reader, the offline engine and the Chinese model are all free and open source — no account, no key, no metering, and no text is uploaded. Only the Windows / Edge online voices are a Microsoft service: free of charge, but often unreachable in mainland China.</p>' +
      '<h3>TXT opens as garbage characters?</h3><p>UTF-8 / GB18030 / UTF-16 are detected automatically. If it still looks wrong, set <b>Settings → TXT encoding</b> manually (GB18030 / Big5 / UTF-16LE) and reopen the book.</p>' +
      '<h3>No sound, or Chinese read as English?</h3><p>Windows: Settings → Time &amp; language → Speech → add a Chinese (Simplified) voice pack, then restart the browser. In the voice dropdown pick an entry starting with <code>zh-CN</code>. Some Android WebViews ship without a speech engine and need a system TTS installed.</p>' +
      '<h3>EPUB fails to open?</h3><p>Standard EPUB 2 / EPUB 3 (ZIP + OPF + spine) is supported. DRM-protected files and Amazon AZW3 / MOBI are out of scope. For very old books with non-standard internal paths, the parser is tolerant about case and encoding.</p>' +
      '<h3>Cleared browser data and lost my books?</h3><p>Data lives in IndexedDB; clearing site data deletes it. <b>Back up</b> first, and keep the original files.</p>' +
      '<h3>How do I move to another computer or phone?</h3><p>Export a backup JSON (tick “include book files”), copy it together with this HTML file, then use <b>Restore</b> on the new device. Or just copy the HTML and re-import the books. The offline voice library is Windows-only: copy the <code>VoicePack</code> folder as well.</p>' +
      '<h3>What is “Resume” on the shelf?</h3><p>Listening position is remembered separately from reading position, so the two never interfere. After listening, the book card shows “▶ Resume · ch. N”; tap it to continue from the exact paragraph. To read from your reading position instead, open the book and tap <b>Read aloud</b>. The button only appears for books you have listened to.</p>' +
      '<h3>Can I change voice halfway through?</h3><p>Use the dropdown at the left of the reading bar — 11 curated voices by default, up to all 174 in Settings. To give dialogue its own voices, tap <b>Multi-voice</b>. The current paragraph is re-read with the new voice; no need to stop or go back to the shelf. <b>Preview voice</b> in Settings lets you compare first.</p>' +
      '<h3>How do highlights and notes work?</h3><p>Select text in the page, then choose a colour, add a note, copy, or make a share card. All highlights are listed under <b>Notes</b> in the side panel and stored with the book — they travel with a full backup. Export them as Markdown from that panel; the <b>Reading summary</b> collects them chapter by chapter.</p>' +
      '<h3>Buttons cramped on a phone?</h3><p>They reflow into a multi-row grid by screen width; nothing to switch by hand. Body text is always one column on a phone, even in landscape.</p>' +
      '<h3>How do I get two columns?</h3><p>Tap <b>Type</b> in the reader and look at <b>Reading mode</b>: switch to <b>Pages</b>, and Columns set to <b>Auto</b> gives you two columns on a wide window; <b>Two</b> forces it when the window is wide enough. Narrow windows and phones fall back to a single column rather than squeezing the text.<br>Paged mode turns whole screens, not pixels: tap the left or right edge, use the wheel, space or ← →, or swipe on a phone.</p>' +
      '<h3>How does auto reading work?</h3><p>Tap <b>Auto</b>: it scrolls at a steady pace, or turns a page every N seconds in paged mode. Tap again to pause — a small pill lets you resume or quit. The next chapter starts by itself at the end. Speech and auto reading never fight over the scroll position.</p>' +
      '<h3>Can I get more immersion?</h3><p>Tap <b>Full</b>: both bars slide away and come back when the pointer reaches the top or bottom edge. For a darker page, lower <b>Brightness</b> under Type → Colours.</p>' +
      '<p class="kv">Still stuck? Read the implementation notes under <b>About</b>, or find the feedback link in the bundled README.</p>',

    disclaimer: '<p>This tool is for reading e-books you lawfully own. It provides, fetches and cracks no copyrighted content and circumvents no digital rights management (DRM). You are responsible for ensuring you have the right to use any file you import, and for any copyright dispute arising from that use.</p>' +

    about: '<p style="font-size:1.2em"><b>MoYin Reader · 墨吟</b></p>' +
      '<p>A single-file, offline-first TXT / EPUB reader with text-to-speech. Double-click the HTML and read; works in any modern browser on Windows, Linux, Android and iOS.</p>' +
      '<p>The Chinese name “墨吟” (“ink, and reading aloud”) and the English name are used by this project only. They are <b>not affiliated with</b> any company, voice platform or streamer of a similar name, and imply no commercial endorsement.</p>' +
      '<p>The shelf + reader layout and the speech scheduling were informed by Koodo Reader on this machine, with all code rewritten from zero and no dependencies: EPUB unzipping, OPF / NCX / Nav contents, body and illustration parsing are all built in, with no external scripts or CDN.</p>' +
      '<p class="kv">Speech can use the free open-source offline neural voices (sherpa-onnx + AISHELL3 multi-speaker VITS): no network, no fees, no account. The model contains 174 Chinese speakers (148 female + 26 male), 11 curated by default, and supports role-based reading. The library ships in <code>VoicePack</code>; the full Windows EXE has it appended inside, so one file is enough.</p>' +
      '<p>Released under the <b>MIT License</b>: use, modify and redistribute freely, including commercially, keeping the copyright and license notice. Full terms under <b>Open source &amp; license</b>.</p>' +
      '<h3>What changed in 1.10.2</h3><ul>' +
      '<li><b>Traditional to Simplified</b>: Settings has a Chinese switch — Original or Simplified. Turn it on for books from Taiwan or old texts; body and contents both convert, and <b>the file itself is never touched</b> — switch back to restore. Built on OpenCC\'s table (2965 one-to-one characters) and a same-length substitution, so highlights, notes and speech positions never drift.</li>' +
      '<li><b>Tap an illustration to enlarge it</b>: maps, character charts and plate pages in EPUB were previously thumbnails only. Tap for full screen, tap anywhere or press Esc to close.</li>' +
      '<li><b>Pinch to change text size</b> on touch screens — no need to open Settings; it saves on release.</li>' +
      '<li><b>A .deb package for Linux</b>: double-click to install and it lands in the app menu, no unzip-and-run needed.</li>' +
      '<li>Fix: the macOS build script no longer forces a pywebview install — if it fails the build continues and the app opens a browser window instead.</li></ul>' +
      '<h3>What changed in 1.10.1</h3><ul>' +
      '<li><b>The Linux / UOS build is a real program now</b>: not "HTML plus a launcher script" but a 10 MB standalone executable. Double-click and it runs — <b>no Python, no dependencies</b>. Verified on UOS Desktop 20 Professional (x86_64): shelf, import, page turning and themes all work.</li>' +
      '<li>It only needs the system libc / libz / libpthread (glibc 2.28+), so UOS 20, Kylin V10 and openEuler 20.03+ run it as is.</li>' +
      '<li>The window uses the system browser in app mode: no address bar, no tabs, a standalone window; closing it quits the program.</li>' +
      '<li>On aarch64 (Phytium / Kunpeng) and loongarch64 (Loongson) it still uses the Python or web route; build-linux.sh in the package builds a native binary on that machine.</li></ul>' +
      '<h3>What changed in 1.10</h3><ul>' +
      '<li><b>Drag files in</b>: drop TXT / EPUB (or a whole folder) onto the window and it imports straight away — no need to open the import dialog and browse. Dropping while reading does not interrupt you.</li>' +
      '<li><b>Window size and position are remembered</b> between launches; a window left off-screen falls back to the default position.</li>' +
      '<li><b>Searchable contents</b>: the chapter list has a search box with a live match count.</li>' +
      '<li><b>Font weight</b>: light / regular / medium / bold.</li>' +
      '<li><b>Linux, UOS/Kylin and macOS builds</b>: unzip and double-click, no Python required.</li></ul>' +
      '<h3>What changed in 1.9.6</h3><ul>' +
      '<li><b>Auto page-turn interval is yours to set</b>: it used to sit at a fixed 20 seconds, with a slider buried in the Type panel that only covered 4–60 in steps of two. Settings now has an <b>Auto-read</b> section up front: <b>3–180 seconds per page</b> in one-second steps, scroll speed 1–10, and a Start button. Dragging the interval while it is running re-times immediately — no need to switch it off and on.</li></ul>' +
      '<h3>What changed in 1.9.5</h3><ul>' +
      '<li><b>Five typefaces became ten</b>: Song, YaHei, Hei, Kai, FangSong, ZhongSong, LiSu, YouYuan, DengXian and Mono. Each button is rendered in its own typeface, so you can compare before choosing.</li>' +
      '<li><b>Richer colours</b>: eight ink swatches (ink black, smoke, deep brown, ochre, navy, ink green, dark red, plum) and eight paper swatches (paper white, cream, parchment, bean green, pale blue, lotus, warm grey, slate). One click applies it; custom pickers remain. Picking a dark paper switches the ink to a light tone automatically.</li>' +
      '<li><b>Many characters, many voices</b>: the role pool used to be the 11 curated voices, so a big cast started sharing. When characters outnumber the voices on hand it now expands to all 174 — 20 characters got 19 distinct voices in testing. Settings shows how many characters and voices this book is using.</li></ul>' +
      '<h3>What changed in 1.9.4</h3><ul>' +
      '<li><b>Font size, line height, typeface and colours are in Settings</b>: they used to live only in the Type panel, with just a link left in Settings. The first screen of Settings now has size A−/A+ plus a slider, a line-height slider, five typefaces (Song / Hei / Kai / FangSong / Mono), two colour pickers for text and paper with a "Use theme" reset, and the six themes. The finer controls (paragraph gap, letter spacing, indent, columns, page animation, measure, brightness, auto-read) stay in the Type panel.</li>' +
      '<li><b>Role-based reading is on by default and actually recognises speakers</b>: previously only "Zhang San said:" style lines were detected — "he looked at me and said:", "I said:", "he suddenly asked me:" were all treated as narration, so the whole passage came out in one voice and the feature looked broken. Those subject patterns are now recognised, and "I said to Yu Houzi" no longer picks the listener as the speaker. Role-based reading is on by default and takes effect when the neural engine is connected; without it the UI says so plainly.</li></ul>' +
      '<h3>What was fixed in 1.9.3</h3><ul>' +
      '<li><b>No more "one narrow column plus a black void"</b>: the page box carried its own clipping, so anything moved in by the page turn got cut off — pages after the first could come out blank. On top of that, opening or closing the sidebar never re-measured, so the turn still used the old column width and stopped half a column in. Clipping now belongs to the outer container and the text box only does layout; the sidebar, immersive mode and window resizing all trigger a fresh measurement.</li>' +
      '<li><b>Measure width applies to pages too</b>: the width cap moved to the outer container, so two columns on a 1920 screen are 688px each, centred, with no stray third column leaking into the margins.</li></ul>' +
      '<h3>What is new in 1.9.2</h3><ul>' +
      '<li><b>Import from a network share (SMB)</b>: the shelf has a <b>Network</b> button. Type a LAN share such as <code>\\\\192.168.1.10\\Books</code>, a mapped drive (<code>Z:\\books</code>) or any local path, and its TXT / EPUB are imported as if they sat on this machine — no copying first. Windows handles the credentials, and an unreachable host answers within 12 seconds instead of spinning forever. Hidden on phones.</li></ul>' +
      '<h3>What was fixed in 1.9.1</h3><ul>' +
      '<li><b>No more half-empty last page</b>: at the end of a chapter the page count was under-calculated, so the remaining columns got squeezed into the left half of the last page — and later columns could not be reached at all. The count now follows the real column total, and the closing block sits in the right column.</li></ul>' +
      '<h3>What is new in 1.9</h3><ul>' +
      '<li><b>Columns stay simple</b>: one or two, nothing more — three or four columns just make Chinese text hard to read. The picker offers <b>Auto / 1 / 2</b>; Auto decides from screen width, and phones always stay single. Picking two columns switches to Pages.</li>' +
      '<li><b>Theme button opens a picker</b>: it used to cycle one step per tap. Now it shows all six themes as cards painted in their own paper and ink, so you can compare them side by side; the panel stays open and each pick applies at once.</li>' +
      '<li><b>Settings always reachable</b>: a <b>Settings</b> button now sits at the end of the reading toolbar, so the full settings are one tap away at any time. On phones the buttons wrap into two tidy rows.</li>' +
      '<li><b>Reading clock</b>: the toolbar shows the current time and how long you have read this session; it turns amber at 30 minutes and red at 60. In immersive mode a faint clock stays in the top-right corner. Tap it to hide it or restart the timer.</li>' +
      '<li><b>Break reminder</b>: after the set stretch (45 minutes by default; 30 / 45 / 60 / 90 or off) a reminder floats up. Take a break to restart the timer, or snooze for ten minutes. Only actual reading counts — going back to the shelf or leaving the window pauses it.</li>' +
      '<li><b>No more half columns</b>: the page step is now measured from the real column pitch, so an extra partial column gets corrected immediately.</li></ul>' +
      '<h3>What is new in 1.8 — typography that can hold its own</h3><ul>' +
      '<li><b>Paged reading</b>: alongside scrolling, the whole chapter can now turn page by page. Wide screens and tablets get <b>two columns</b>, phones stay <b>single column</b>. Tap the left or right edge, use the wheel, space, ← →, or swipe on a phone; the turn animation can slide, fade or none.</li>' +
      '<li><b>One type panel</b>: the <b>Type</b> button collects everything — font size (A− / A+ / slider), line height, paragraph gap, letter spacing, first-line indent, five families (Song / Hei / Kai / FangSong / Mono), justified or ragged right, measure width and side margins, with a reset at the bottom.</li>' +
      '<li><b>Six themes</b>: dark, light and sepia, plus <b>green, slate and pure black</b>; you can also pick your own paper and text colour and clear them again. Dark mode has an extra brightness dimmer for reading with the lights off.</li>' +
      '<li><b>Auto read</b>: continuous scrolling, or timed page turns in paged mode. Pause and resume from a small pill; the next chapter starts automatically at the end.</li>' +
      '<li><b>Immersive full screen</b>: both bars slide away and come back when the pointer reaches the top or bottom edge. F11 or the <b>Full</b> button; Esc backs out step by step.</li>' +
      '<li><b>Two long-standing bugs fixed</b>: styles shipped inside a book (things like <code>body{margin:5%}</code>) used to leak onto the reading container and squeeze the measure — which is why the right column of a two-column page was clipped. Books can now only style their own paragraphs; the measure and type scale are yours. A chapter heading repeated inside the body is also removed.</li></ul>' +
      '<h3>What was fixed in 1.8.1</h3><ul>' +
      '<li><b>“Two columns” now works the moment you pick it.</b> Previously you had to switch to Pages first; choosing it while scrolling did nothing, which looked broken. Picking two columns now switches to Pages and lays out both columns right away, and going back to Scroll returns to one column — both directions show a short notice. Same for TXT and EPUB.</li>' +
      '<li><b>Switching reading mode keeps your place</b>: flip between scroll and pages mid-chapter and you stay on the paragraph you were reading instead of jumping back to the start.</li>' +
      '<li><b>More room at the foot of the page</b>: the last line no longer sits against the bottom toolbar in paged mode.</li></ul>' +
      '<h3>What is new in 1.7</h3><ul>' +
      '<li><b>Full bilingual interface</b>: one switch on the shelf flips the entire window — buttons, settings, dialogs, toasts and all documentation — between Chinese and English. Your choice is remembered.</li>' +
      '<li><b>Highlights &amp; notes</b>: select text to highlight it in four colours, attach a note, or both. Every annotation is listed in the new <b>Notes</b> panel where you can jump to it, edit it or delete it.</li>' +
      '<li><b>Share cards</b>: turn a highlight into a PNG card with the book title and excerpt, ready to post.</li>' +
      '<li><b>Export &amp; summary</b>: export all notes as Markdown or plain text; <b>Reading summary</b> reports time read, streak, progress and a chapter-by-chapter excerpt list you can export.</li>' +
      '<li><b>Real shelves</b>: create, rename and delete shelves, mark favorites, batch move or remove books, edit title and author, and import a whole folder of books at once.</li>' +
      '<li><b>Reading time</b>: every session is timed and accumulated per book and overall, without sending anything anywhere.</li></ul>' +
      '<p class="kv">Fixed in 1.7.1</p><ul>' +
      '<li><b>Highlighting now works in the desktop app</b> — the Windows shell disabled web text selection by default, so dragging over the text did nothing and the colour toolbar never appeared. Selection is enabled now.</li>' +
      '<li><b>Folder import no longer looks like an upload</b> — the desktop build opens the native folder picker instead of the browser\'s “select the folder to upload … Upload” dialog.</li>' +
      '<li><b>The left sidebar can be dismissed</b> — there is a × on the tab strip, clicking the same toolbar button toggles it, and clicking the page closes it (unless you have text selected, so a fresh selection is never disturbed).</li></ul>' +
      '<p class="kv">Version 1.9.1 · single file · offline by default · data stays on this device<br>Author / copyright © 2026 Lanlan Eternal (永远的兰兰)<br>Feedback and source: see the repository address in the bundled README</p>'
  };

    var u = new Uint8Array(buf), s = '', CH = 0x8000, i;
    for (i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH));

  /* ---------------- IndexedDB：元数据与书籍二进制分库 ---------------- */
  function openDB() {
    if (DB) return Promise.resolve(DB);
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DBNAME, 1);
      r.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
      };
      r.onsuccess = function (e) { DB = e.target.result; res(DB); };
      r.onerror = function (e) { rej(e.target.error); };
    });
  }
  function tx(store, mode, fn) {
    return openDB().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(store, mode), s = t.objectStore(store), q = fn(s);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { rej(q.error); };
      });
    });
  }

  function dbGet(s, k) { return tx(s, 'readonly', function (o) { return o.get(k); }); }
  function dbAll(s) { return tx(s, 'readonly', function (o) { return o.getAll(); }); }
  function dbDel(s, k) { return tx(s, 'readwrite', function (o) { return o.delete(k); }); }

  /* ================= 分页引擎（翻页模式） =================
     用 CSS 多栏 + translateX 平移：column-fill:auto 会把超出高度的内容
     继续往右排成新列，#pageWrap 负责裁掉，翻页只是横向平移。 */
  var PG = { i: 0, count: 1, cols: 1, cw: 0, gap: 0, padL: 0, step: 0, ready: 0 };

  function pgEnabled() { return CFG.mode === 'page'; }
  /* 主指针是手指（手机 / 平板）：这类设备没有键盘和滚轮，
     滚动模式下也要允许「点两侧翻一屏」，否则只能一直滑。 */
  function touchy() {
    try { return window.matchMedia('(pointer: coarse)').matches; }
    catch (e) { return (navigator.maxTouchPoints || 0) > 0; }
  }
  /* 每屏几栏：只有单栏和双栏。auto 够宽就双栏，手机一律单栏 */
  /* 真正可用的宽度：容器父级减掉侧栏。不能用 #pageWrap.clientWidth——
     它已经被上一轮的 --pcols 限宽了，拿它做判断会越算越窄。 */
  function pgAvailW() {
    var rm = $('readMain');
    var w = rm ? rm.clientWidth : (window.innerWidth || 800);
    var side = $('side');
    if (side && side.classList.contains('on')) w -= side.offsetWidth || 0;
    return Math.max(240, w);
  }
  function pgCols() {
    if (!pgEnabled()) return 1;
    var w = pgAvailW();
    if (w < 620) return 1;                        // 手机一律单栏
    var pad = Math.max(10, Number(CFG.padw) || 32);
    var usable = w - pad * 2 + 60;                // 加上最后一个栏距，便于整除
    var want = LAYN[CFG.lay] || 0;
    if (!want) want = usable >= 880 ? 2 : 1;                                // 自动：够宽才双栏
    var maxFit = Math.max(1, Math.floor(usable / 360));                     // 双栏每栏至少 300px
    return Math.max(1, Math.min(want, maxFit, 2));
  }
  function pgGeo() {
    var el = $('page'), cs = getComputedStyle(el);
    var padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
    var gap = parseFloat(cs.columnGap) || 0;
    var cols = pgCols();
    var contentW = Math.max(140, el.clientWidth - padL - padR);
    var cw = Math.max(60, (contentW - gap * (cols - 1)) / cols);
    return { padL: padL, padR: padR, gap: gap, cols: cols, cw: cw, step: cols * (cw + gap) };
  }
  /* 量一次：算出每列宽、总列数、总页数（用最后一块所在的列反推，最可靠） */
  function pgReset() {
    var el = $('page'); if (!el) return;
    el.style.columnCount = ''; el.style.transform = ''; el.style.removeProperty('--pcols');
    var wrap = $('pageWrap');
    if (wrap) { wrap.style.removeProperty('--pcols'); wrap.style.removeProperty('max-width'); }
    el.classList.remove('pg-slide', 'pg-fade');
    PG.cols = 1; PG.count = 1; PG.i = 0; PG.ready = 0;
  }
  /* 实测列距：把段落矩形的左缘聚类，相邻簇中位数之差就是「列宽 + 栏距」。
     比拿容器宽自己除更可靠——浏览器若因取整排出了半列，这里能立刻纠正步长。 */
  function pgRealStep() {
    var el = $('page'); if (!el) return 0;
    var list = el.querySelectorAll('.rdp'), n = Math.min(list.length, 160), lefts = [];
    for (var i = 0; i < n; i++) {
      var rs = list[i].getClientRects();
      for (var j = 0; j < rs.length; j++) if (rs[j].width > 40 && rs[j].height > 2) lefts.push(Math.round(rs[j].left));
    }
    if (lefts.length < 2) return 0;
    lefts.sort(function (a, b) { return a - b; });
    var groups = [[lefts[0]]];
    for (var k = 1; k < lefts.length; k++) {
      var g = groups[groups.length - 1];
      if (lefts[k] - g[g.length - 1] > 46) groups.push([lefts[k]]); else g.push(lefts[k]);
    }
    if (groups.length < 2) return 0;
    var med = function (a) { return a[a.length >> 1]; }, d = [];
    for (var m = 1; m < groups.length; m++) d.push(med(groups[m]) - med(groups[m - 1]));
    d.sort(function (a, b) { return a - b; });
    return d[d.length >> 1];
  }
  function pgMeasure() {
    var el = $('page');
    if (!el) return PG;
    if (!pgEnabled()) { pgReset(); return PG; }
    var cols = pgCols();
    var wrap = $('pageWrap');
    if (wrap) wrap.style.setProperty('--pcols', cols);   // 容器靠它算 max-width
    el.style.removeProperty('--pcols');
    el.style.columnCount = cols;
    el.style.transform = 'translateX(0px)';
    var m = pgGeo();
    var real = pgRealStep();                    // 实测「列宽 + 栏距」
    if (real > 80) { m.cw = Math.max(60, real - m.gap); m.step = m.cols * real; }
    var base = el.getBoundingClientRect().left + m.padL;
    var last = el.querySelector('#chEnd') || el.lastElementChild;
    var col = 0;
    if (last) {
      var rs = last.getClientRects();
      var r = rs.length ? rs[rs.length - 1] : last.getBoundingClientRect();
      // 除以「列宽 + 栏距」（单列步距），得到的是第几列；m.step 是一屏宽，别混用
      col = Math.max(0, Math.round((r.left - base) / (m.cw + m.gap)));
    }
    PG.cols = m.cols; PG.cw = m.cw; PG.gap = m.gap; PG.padL = m.padL; PG.step = m.step;
    PG.count = Math.max(1, Math.ceil((col + 1) / m.cols));
    if (PG.i > PG.count - 1) PG.i = PG.count - 1;
    PG.ready = 1;
    return PG;
  }
  function pgTo(i, opt) {
    opt = opt || {};
    if (!pgEnabled()) return;
    var el = $('page');
    if (!PG.ready) pgMeasure();
    PG.i = Math.max(0, Math.min(PG.count - 1, i | 0));
    var anim = !opt.instant && !CFG.motion && CFG.pageAnim !== 'none';
    var slide = anim && CFG.pageAnim === 'slide';
    el.classList.toggle('pg-slide', slide);
    el.style.transform = 'translateX(' + (-PG.i * PG.step) + 'px)';
    if (anim && CFG.pageAnim === 'fade') {

      void el.offsetWidth;
      el.classList.add('pg-fade');

  /* 某个元素落在第几页 */

    var el = $('page');

    var base = el.getBoundingClientRect().left + padL;
    var r = p.getBoundingClientRect();
    var col = Math.round((r.left - base) / ((PG.cw || 1) + (PG.gap || 0)));

    return Math.max(0, Math.min(PG.count - 1, Math.floor(col / (PG.cols || 1))));
  }
  /* 当前页第一个段落 */
  function pgTopPara() {
    var list = $('page') ? $('page').querySelectorAll('.rdp') : [];
    for (var i = 0; i < list.length; i++) if (paraPage(list[i]) === PG.i) return list[i];
    return null;
  }
  /* 滚动模式下：视口里第一个露头的段落（从滚动切到翻页时拿它当锚点） */
  function scrollTopPara() {
    var list = $('page') ? $('page').querySelectorAll('.rdp') : [];
    if (!list.length) return null;
    var box = $('pageWrap').getBoundingClientRect();
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (r.height && r.bottom > box.top + 6) return list[i];
    }
    return null;
  }
  /* 改字号 / 换屏宽后：重新分页，尽量停在原来那段 */
  function pgReflow(anchor) {
    if (!BK || !pgEnabled()) return;

  /* 把 EPUB 正文重建为扁平的朗读段落：兼容 <p> 分段、<div> 嵌套、纯 <br> 分段的老书，

  function buildParagraphs(body) {
    var out = [], cur = '', head = false;
    var BLOCK = /^(p|div|h[1-6]|li|blockquote|pre|section|article|tr|td|ul|ol|table|dl|dt|dd|center|address)$/;
    function flush() {
      var plain = cur.replace(/<[^>]*>/g, '').replace(/&nbsp;/gi, ' ').replace(/&amp;/g, '&').trim();
      var hasMedia = /<(img|image)\b/i.test(cur);   // 封面 / 插图页没有文字，也要保留
      if (plain || hasMedia) out.push('<p class="rdp' + (head ? ' rdh' : '') + '">' + cur + '</p>');
      cur = ''; head = false;
    }
    function walk(node) {
      Array.prototype.forEach.call(node.childNodes, function (n) {
        if (n.nodeType === 3) { cur += esc(n.nodeValue); return; }
        if (n.nodeType !== 1) return;
        var tag = n.tagName.toLowerCase();
        if (/^(script|style|noscript|br)$/.test(tag)) { if (tag === 'br') flush(); return; }
        if (BLOCK.test(tag)) {
          flush(); head = /^h[1-6]$/.test(tag);
          walk(n); flush(); return;
        }
        cur += n.outerHTML;   // 内联元素已清理过危险属性，可直接保留
      });
    }
    walk(body); flush();

  function epubChapter(idx) {

    var txt = Z.decodeAny(raw).text, dir = pathDir(href);

      var p = Z.resolvePath(dir, l.getAttribute('href') || ''), t = BK.zip.text(p);

  /* ---------------- 阅读统计（本机） ---------------- */
  var STATS = { days: {}, total: 0 };

  }
  function saveStats() { try { localStorage.setItem('MOYIN_STATS', JSON.stringify(STATS)); } catch (e) { } }

  /* 时长文案：小于 1 分钟说秒，1 小时内说分，超过说时分 */

  async function importFiles(files) {

      var bname = f.name.replace(/\.[^.]+$/, '');
      if (BOOKS.some(function (b) { return b.name === bname && b.size === f.size; })) { skipN++; continue; }
      try {
        if (total > 3) toast(T('导入中… {a}/{b}', { a: i + 1, b: total }), 1500);
        var buf = await f.arrayBuffer();
        var b = await parseBook(buf, bname, ext);
        var id = 'b' + Date.now() + Math.random().toString(36).slice(2, 7);
        await dbPut('blobs', { id: id, buf: buf });
        var meta = {
          id: id, name: bname, ext: ext, size: f.size,
          added: Date.now(), last: Date.now(), ch: 0, ratio: 0, progress: 0,
          cover: b.cover || '', title: b.title, author: b.author || '', marks: [], hl: [],
          chapters: b.titles.slice(0, 1000), tocCount: b.toc.length, enc: b.enc || '',
          group: shelfView().indexOf('g:') === 0 ? shelfView().slice(2) : '',

        await dbPut('books', meta); BOOKS.push(meta); okN++;
        if (b.enc && b.enc !== 'UTF-8' && b.enc !== 'UTF-8 BOM') toast(T('《{n}》按 {e} 解码', { n: meta.name, e: b.enc }), 3200);
      } catch (e) { errs.push(f.name + '：' + e.message); }
    }
    renderShelf();
    var msg = T('已导入 {n} 本', { n: okN });
    if (skipN) msg += ' · ' + T('跳过 {n} 本（重复或不支持）', { n: skipN });

    if (okN || skipN || errs.length) toast(msg, 3000);
    if (errs.length) showModal(T('部分文件未能导入'), '<p>' + errs.map(esc).join('</p><p>') + '</p>', [{ label: T('知道了') }]);
  }

  /* 书里正文常自带一个章节标题，和顶部 #chTitle 重复 —— 去重，只留一个 */
  function dedupeHead() {
    var t = $('chTitle'); if (!t) return;
    var norm = function (s) {
      return String(s || '').toLowerCase()
        .replace(/[\s\u3000·・.,，。:：、!！?？"'“”‘’（）()《》〈〉【】\[\]\-—_~～]/g, '');
    };
    var want = norm(t.textContent);
    if (want.length < 2) return;
    var n = 0, el = t.nextElementSibling;
    while (el && n++ < 8) {
      if (el.id === 'chEnd') break;
      var tag = el.tagName;
      if (/^H[1-6]$/.test(tag) || el.classList.contains('rdh') || tag === 'P' || tag === 'DIV') {
        // 整段文字和标题完全一样：不管它是 h2 还是普通段落，都是重复的标题
        var got = norm(el.textContent);
        if (!got) { el = el.nextElementSibling; continue; }
        if (got === want) { el.classList.add('dupH'); return; }
        // 真标题才允许「包含」式匹配（书里常带副标题或多一个「第 x 章」前缀）
        if (/^H[1-6]$/.test(tag) || el.classList.contains('rdh')) {
          if (got.length > 3 && (want.indexOf(got) === 0 || got.indexOf(want) === 0)) {
            el.classList.add('dupH');
            return;
          }
        }
      }
      el = el.nextElementSibling;
    }
  }
  function renderChapter(i, opt) {
    if (!BK) return;
    opt = opt || {};
    i = Math.max(0, Math.min(chapterCount() - 1, i | 0));
    BK.ch = i;
    var html;
    try { html = BK.chapterHtml(i); } catch (e) { html = '<p class="rdp">' + esc(T('本章读取失败：') + e.message) + '</p>'; }
    /* 繁→简只改显示文本，不动书里的数据：关掉开关重新渲染一次就还原 */
    if (Number(CFG.hans) === 1) html = hansify(html);
    var chTitleTx = Number(CFG.hans) === 1 ? hansify(chapterTitle(i)) : chapterTitle(i);
    PG.ready = 0;                                     // 换章了，旧的页数作废
    $('page').innerHTML = '<div id="chTitle">' + esc(chTitleTx) + '</div>' + html +
      '<div id="chEnd">' + esc(T('— 本章完 —')) + '<br><button data-act="next">' + esc(T('下一章 →')) + '</button></div>';
    dedupeHead();
    $('pageWrap').scrollTop = 0;
    applyHighlights();
    SPK.paras = Array.prototype.slice.call($('page').querySelectorAll('.rdp'));
    // 翻页模式：量好列数页数后定位；滚动模式：按比例还原

    if (!pgEnabled() && opt.ratio) setTimeout(function () {
      var w = $('pageWrap'); w.scrollTop = (w.scrollHeight - w.clientHeight) * opt.ratio;
    }, 60);
    if (opt.anchor) setTimeout(function () {
      var list = $('page').querySelectorAll('[id],[name]'), j, an = String(opt.anchor);
      for (j = 0; j < list.length; j++) {
        if (list[j].id === an || list[j].getAttribute('name') === an) {

          else list[j].scrollIntoView({ block: 'center' });

  }
  var saveT = null;
  /* 改高亮 / 笔记后重绘本章，位置保持不动（翻页模式停在原页） */
  function renderKeep(opt) {

  function updateProgress() {

    } else {
      var w = $('pageWrap'), max = Math.max(1, w.scrollHeight - w.clientHeight);

  function savePos() {

    clearTimeout(saveT);

      m.ch = ch; m.ratio = ratio; m.progress = (ch + ratio) / n * 100;
      m.last = Date.now();
      dbPut('books', m).catch(function () {});

    }, 400);
  }
  function nextCh(d) { if (BK) renderChapter(BK.ch + d); }
  function currentPara() {

      // 本页没有段落（例如只剩「本章完」）：取离当前页最近的一段
      var best = 0, bd = 1e9;
      SPK.paras.forEach(function (p, i) {
        var d = Math.abs(paraPage(p) - PG.i);
        if (d < bd) { bd = d; best = i; }
      });

    }
    var w = $('pageWrap'), top = w.getBoundingClientRect().top, b0 = 0, bd0 = 1e9;
    SPK.paras.forEach(function (p, i) { var dd = Math.abs(p.getBoundingClientRect().top - top - 90); if (dd < bd0) { bd0 = dd; b0 = i; } });
    return b0;
  }

  /* ---------------- 划线高亮与批注 ----------------

  var SEL = { text: '', ch: 0, p: 0, s: 0, e: 0, rect: null };

  function closestPara(node) {

    var w = document.createTreeWalker(para, NodeFilter.SHOW_TEXT, null), n, acc = 0;

    while ((n = w.nextNode())) {

    if (!list.length) return;

    list.forEach(function (h) {
      var p = paras[h.p]; if (!p) return;
      var r = rangeAt(p, h.s, h.e);

    var s0 = textOffsetIn(p0, range.startContainer, range.startOffset);
    var s1 = textOffsetIn(p0, range.endContainer, range.endOffset);
    if (s0 < 0 || s1 <= s0) return null;

  /* ---- 分享卡片：canvas 画一张 1080 宽的图文 ---- */
  function wrapLines(g, text, maxW) {
    var lines = [], cur = '';

      var ch = text[i];

    g.font = fs + 'px "Noto Serif CJK SC","Songti SC",serif';

    var lines = wrapLines(g, body, W - pad * 2).slice(0, 14);

    cv.width = W; cv.height = H;

  /* 文本规范化：去掉零宽符、汉字间排版空格、重复标点；保留引号破折号供语音自行处理停顿 */
