<style>
:root{
  --bg:#1B1C1F; --card:#24262A; --card2:#2C2F34; --line:#3A3D43;
  --tx:#E6E4E1; --tx2:#A5A29D; --acc:#4A9EFF; --ok:#3FC08A; --warn:#E8A33D; --bad:#E2685F;
  --paper:#1F2125; --paperTx:#E6E4E1; --paperTx2:#A5A29D;
  --fs:19px; --lh:1.85; --pagew:720px; --ff:"Noto Serif CJK SC","Songti SC","SimSun",Georgia,serif;
  --ps:.85em; --ls:.02em; --ind:0em; --padx:32px;
  --tap:34px; --ui:1;
}
html[data-theme="light"]{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#E9EBEF; --line:#D6D9DF;
  --tx:#1D1F23; --tx2:#5E646D; --acc:#1668C4;
  --paper:#FFFFFF; --paperTx:#22252B; --paperTx2:#5E646D;
}
html[data-theme="sepia"]{
  --bg:#EDE3CE; --card:#F7F0E0; --card2:#E8DBC0; --line:#D6C6A6;
  --tx:#3A3227; --tx2:#6F6150; --acc:#9A5B2C;
  --paper:#FAF3E3; --paperTx:#3B3226; --paperTx2:#6F6150;
}
html[data-theme="green"]{
  --bg:#E4EDDD; --card:#F4F8EF; --card2:#DCE7D3; --line:#C6D5BB;
  --tx:#25301D; --tx2:#5B6B50; --acc:#3E7C4C;
  --paper:#F3F8EC; --paperTx:#26301D; --paperTx2:#5B6B50;
}
html[data-theme="gray"]{
  --bg:#20262E; --card:#2A323C; --card2:#333C48; --line:#43505F;
  --tx:#DEE5EE; --tx2:#9BA7B6; --acc:#69A8F5;
  --paper:#252D37; --paperTx:#DEE5EE; --paperTx2:#9BA7B6;
}
html[data-theme="black"]{
  --bg:#000000; --card:#0E0E10; --card2:#17171A; --line:#2A2A2E;
  --tx:#C9C9CC; --tx2:#85858A; --acc:#5AA9FF;
  --paper:#000000; --paperTx:#C4C4C8; --paperTx2:#7E7E84;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
  font-size:calc(14px * var(--ui)); line-height:1.5; overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;min-height:var(--tap);white-space:nowrap}
button:hover{border-color:var(--acc);color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{filter:brightness(1.12);color:#fff}
button.ghost{background:transparent}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
input[type=text],input[type=search],input[type=number],input[type=password],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:var(--tap);outline:none}
input:focus,select:focus{border-color:var(--acc)}
input[type=range]{accent-color:var(--acc);height:var(--tap);min-width:90px}
#app{height:100dvh;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
#webTip{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:.82em;line-height:1.45;
  background:linear-gradient(90deg,rgba(74,158,255,.16),rgba(74,158,255,.05));color:var(--tx2);
  border-bottom:1px solid var(--line)}
#webTip[hidden]{display:none}
#webTip span{flex:1;min-width:0}
#webTip b{color:var(--tx);font-weight:600}
#webTip a{color:var(--acc);text-decoration:none;white-space:nowrap}
#webTip a:hover{text-decoration:underline}
#webTip button{min-height:24px;padding:1px 7px;font-size:1.15em;line-height:1;background:transparent;border-color:transparent;color:var(--tx2)}
.brand{font-size:1.25em;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.brand small{font-size:.55em;font-weight:400;color:var(--tx2);letter-spacing:.05em;margin-left:8px}
.acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spacer{flex:1 1 auto}
.hint{color:var(--tx2);font-size:.86em}
/* ---------- 书架 ---------- */
#libBody{flex:1;min-height:0;overflow-y:auto;padding:18px}
.shelf{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));max-width:1300px;margin:0 auto}
.bk{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.bk:hover{transform:translateY(-3px);border-color:var(--acc)}
.bk .cv{height:196px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bk .cv img{width:100%;height:100%;object-fit:cover}
.bk .cv .ph{font-size:2.2em;opacity:.35;font-family:var(--ff);line-height:1.2;text-align:center;padding:12px;word-break:break-all}
.bk .meta{padding:9px 10px 11px}
.bk .nm{font-weight:600;font-size:.95em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.7em}
.bk .sub{color:var(--tx2);font-size:.78em;margin-top:5px;display:flex;gap:6px;align-items:center}
.bk .bar{height:4px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
.bk .bar i{display:block;height:100%;background:var(--acc)}
.bk .del{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:8px;padding:0;min-height:28px;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:15px;opacity:0}
.bk:hover .del{opacity:1}
.bk .resume{display:block;width:100%;margin-top:8px;padding:5px 8px;min-height:30px;font-size:.8em;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--acc);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .resume:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{font-size:.7em;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--tx2)}
.empty{max-width:560px;margin:9vh auto;text-align:center;color:var(--tx2);line-height:2}
.empty .big{font-size:3em;opacity:.4;font-family:var(--ff)}
.foot{flex:0 0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;background:var(--card);border-top:1px solid var(--line);color:var(--tx2);font-size:.84em}
/* ---------- 阅读器 ---------- */
#readTop{padding:8px 12px}
#readTitle{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#readMain{flex:1;min-height:0;display:flex}
.side{width:290px;flex:0 0 auto;background:var(--card);border-right:1px solid var(--line);display:none;flex-direction:column;min-height:0}
.side.on{display:flex}
.side .tabs{display:flex;gap:4px;padding:9px;border-bottom:1px solid var(--line);flex:0 0 auto}
.side .tabs button{flex:1;padding:6px 4px;font-size:.86em}
.side .tabs button.sideX{flex:0 0 auto;width:27px;padding:6px 0;font-size:1.08em;line-height:1;background:transparent;border-color:transparent;color:var(--tx2)}
.side .tabs button.sideX:hover{color:var(--bad);border-color:var(--line)}
/* 正文必须能选中：桌面外壳默认把 user-select 关掉，会连带把划线批注一起废掉 */
#page,#page *{-webkit-user-select:text;user-select:text}
.side .body,.noteIt{-webkit-user-select:text;user-select:text}
.side .body{flex:1;min-height:0;overflow-y:auto;padding:8px}
.side .it{display:block;width:100%;text-align:left;background:transparent;border:none;border-radius:7px;padding:8px 9px;margin-bottom:2px;color:var(--tx);font-size:.9em;white-space:normal;line-height:1.45}
.side .it:hover{background:var(--card2);color:var(--acc)}
.side .it.cur{background:var(--card2);color:var(--acc);font-weight:600}
.side .it.lv1{padding-left:22px;font-size:.86em;color:var(--tx2)}
.side .it.lv2{padding-left:36px;font-size:.82em;color:var(--tx2)}
.side .q{width:100%;margin-bottom:9px}
#pageWrap{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;background:var(--bg);position:relative}
/* 自动滚动时关掉平滑滚动，否则每帧设置 scrollTop 会被动画吃掉 */
body.autoscroll #pageWrap{scroll-behavior:auto}
#page{max-width:var(--pagew);margin:0 auto;padding:34px var(--padx) 70px;background:var(--paper);color:var(--paperTx);
  font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);min-height:100%;letter-spacing:var(--ls)}
#page h1,#page h2,#page h3,#page h4{line-height:1.4;margin:1.4em 0 .7em;font-weight:700;text-align:left}
#page h1{font-size:1.5em}#page h2{font-size:1.28em}#page h3{font-size:1.12em}
/* 段落排版：带上 html[data-mode] 提高权重，保证用户的段距/缩进能压过书自带样式 */
html[data-mode] #page p,html[data-mode] #page .rdp{margin:0 0 var(--ps);text-align:justify;text-indent:var(--ind)}
#page .rdh{font-weight:700;font-size:1.16em;margin:1.3em 0 .7em;text-align:left}
#page img,#page svg{max-width:100%;height:auto;display:block;margin:12px auto}
/* 点插图看大图 */
#page img{cursor:zoom-in}
#imgView{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.86);cursor:zoom-out;padding:16px}
#imgView.on{display:flex}
#imgView img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain;
  box-shadow:0 18px 60px rgba(0,0,0,.6);border-radius:4px}
#imgView .ivTip{position:absolute;bottom:14px;left:0;right:0;text-align:center;
  color:#C9C9C9;font-size:.8em;pointer-events:none}
#page blockquote{border-left:3px solid var(--acc);padding-left:14px;margin:1em 0;color:var(--paperTx2)}
#page a{color:var(--acc);cursor:pointer;text-decoration:underline}
#page .rdp{border-left:3px solid transparent;margin-left:-15px;padding-left:12px;border-radius:3px}
#page .rdp.speaking{background:rgba(74,158,255,.15);border-left-color:var(--acc)}
#page .rdp.hit{background:rgba(232,163,61,.28)}
#chTitle{font-size:1.35em;font-weight:700;margin:0 0 1.1em;padding-bottom:.5em;border-bottom:1px solid var(--line);font-family:var(--ff)}
#chEnd{text-align:center;padding:26px 0 8px;color:var(--paperTx2);font-size:.85em}
/* 书自带、与顶栏标题重复的那行标题 */
#page .dupH{display:none}
#readFoot{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--card);border-top:1px solid var(--line)}
#progRange{flex:1;min-width:80px}
/* 朗读条 */
.speakbar{display:none;flex:0 0 auto;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 13px;background:var(--card2);border-top:2px solid var(--acc)}
.speakbar.on{display:flex}
.speakbar .grp{display:flex;gap:5px;align-items:center}
.speakbar select{max-width:190px}
.speakbar #spVoice{max-width:250px}
.speakbar #spNow{color:var(--tx2);font-size:.84em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 180px}
.spdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.2s infinite}
.spwho{color:var(--acc);font-weight:600;margin-right:6px}
.spwho::before{content:"「"}.spwho::after{content:"」"}
.vq{font-size:.8em;padding:3px 8px;border-radius:10px;white-space:nowrap;cursor:pointer;border:1px solid transparent;flex:0 0 auto}
.vq.good{color:#7ee0a8;background:rgba(46,190,110,.13);border-color:rgba(46,190,110,.35)}
.vq.mid{color:#e8c46a;background:rgba(232,163,61,.12);border-color:rgba(232,163,61,.30)}
.vq.bad{color:#e79a9a;background:rgba(220,90,90,.12);border-color:rgba(220,90,90,.30)}
@keyframes pulse{50%{opacity:.25}}
html[data-motion="low"] *{animation:none!important;transition:none!important}
/* 弹层 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(680px,100%);max-height:86dvh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.mbox .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;flex:0 0 auto}
.mbox .mb{padding:16px;overflow-y:auto;line-height:1.8}
.mbox .mf{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.mbox h3{margin:1.2em 0 .5em;font-size:1.05em}
.mbox h3:first-child{margin-top:0}
.mbox p{margin:.5em 0}
.mbox ul{padding-left:1.4em;margin:.5em 0}
.mbox .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.mbox .row label{min-width:76px;color:var(--tx2)}
.mbox .seg{display:flex;gap:5px;flex-wrap:wrap}
.mbox .kv{color:var(--tx2);font-size:.9em}
.mbox code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:.9em}
/* 拖文件进来时的提示层 */
#dropHint{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(20,22,26,.62);backdrop-filter:blur(2px)}
#dropHint.on{display:flex}
#dropHint .dh{padding:26px 34px;border-radius:14px;border:2px dashed var(--acc);
  background:var(--card);color:var(--tx);text-align:center;box-shadow:0 18px 46px rgba(0,0,0,.5)}
#dropHint .dh b{display:block;font-size:1.16em;margin-bottom:6px;color:var(--acc)}
#dropHint .dh span{font-size:.9em;color:var(--tx2)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;display:none;max-width:86vw;text-align:center;font-size:.9em}
#toast.on{display:block}
.docnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.docnav button{padding:5px 10px;min-height:30px}
/* ---------- 书架分组条 ---------- */
#shelfBar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 14px;background:var(--card);
  border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#shelfBar::-webkit-scrollbar{display:none}
#shelfBar .chip{flex:0 0 auto;padding:4px 11px;min-height:28px;font-size:.84em;border-radius:14px;background:transparent;color:var(--tx2)}
#shelfBar .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#shelfBar .chip .n{opacity:.6;margin-left:4px;font-size:.9em}
#shelfBar .add{border-style:dashed}
/* ---------- 批量操作条 ---------- */
#selBar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--card2);
  border-bottom:1px solid var(--line);font-size:.86em;flex-wrap:wrap}
#selBar[hidden]{display:none}
/* ---------- 书架卡片新增控件 ---------- */
.bk .fav{position:absolute;left:6px;top:6px;width:28px;height:28px;border-radius:8px;padding:0;min-height:28px;
  background:rgba(0,0,0,.5);border:none;color:#fff;font-size:15px;opacity:0;line-height:1}
.bk:hover .fav,.bk .fav.on{opacity:1}
.bk .fav.on{color:#FFC53D;background:rgba(0,0,0,.62)}
.bk .more{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:8px;padding:0;min-height:28px;
  background:rgba(0,0,0,.55);border:none;color:#fff;font-size:15px;opacity:0;line-height:1}
.bk:hover .more{opacity:1}
.bk .del{display:none}
.bk .kn{position:absolute;left:6px;bottom:6px;font-size:.7em;padding:1px 6px;border-radius:8px;
  background:rgba(0,0,0,.6);color:#fff;line-height:1.5;pointer-events:none}
.bk .chk{position:absolute;left:7px;top:7px;width:22px;height:22px;border-radius:6px;border:2px solid #fff;
  background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;color:#fff;font-size:13px;line-height:1}
body.selmode .bk .chk{display:flex}
body.selmode .bk .fav,body.selmode .bk .more{display:none}
body.selmode .bk.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
body.selmode .bk.sel .chk{background:var(--acc);border-color:var(--acc)}
body.selmode .bk .resume{pointer-events:none}
/* ---------- 正文高亮 / 批注 ---------- */
#page mark{background:rgba(255,214,102,.42);color:inherit;border-radius:2px;padding:0 .06em;cursor:pointer}
#page mark.hl-g{background:rgba(122,214,140,.36)}
#page mark.hl-b{background:rgba(122,178,255,.34)}
#page mark.hl-p{background:rgba(255,150,196,.34)}
#page mark.hasNote{border-bottom:1.5px solid rgba(255,214,102,.95)}
#page mark.hl-g.hasNote{border-bottom-color:rgba(122,214,140,.95)}
#page mark.hl-b.hasNote{border-bottom-color:rgba(122,178,255,.95)}
#page mark.hl-p.hasNote{border-bottom-color:rgba(255,150,196,.95)}
html[data-theme="light"] #page mark{background:rgba(255,214,102,.62)}
html[data-theme="light"] #page mark.hl-g{background:rgba(122,214,140,.55)}
html[data-theme="light"] #page mark.hl-b{background:rgba(122,178,255,.45)}
html[data-theme="light"] #page mark.hl-p{background:rgba(255,150,196,.45)}
/* 选中文字浮动工具条 */
#selTools{position:fixed;z-index:70;display:none;align-items:center;gap:4px;padding:5px 6px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:.86em}
#selTools.on{display:flex}
#selTools .sw{width:22px;height:22px;min-height:22px;border-radius:50%;padding:0;border:1.5px solid rgba(0,0,0,.15);cursor:pointer}
#selTools .sw[data-hl="y"]{background:#FFD666}
#selTools .sw[data-hl="g"]{background:#7AD68C}
#selTools .sw[data-hl="b"]{background:#7AB2FF}
#selTools .sw[data-hl="p"]{background:#FF96C4}
#selTools button.act{padding:4px 9px;min-height:26px;background:transparent;border-color:transparent;color:var(--tx)}
#selTools button.act:hover{background:var(--card2);color:var(--acc)}
#selTools .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
/* 笔记侧栏 */
.noteIt{background:var(--card2);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.noteIt:hover{outline:1px solid var(--acc)}
.noteIt .q{color:var(--tx);font-size:.9em;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.noteIt .cm{color:var(--tx2);font-size:.86em;margin-top:5px;padding-left:8px;border-left:2px solid var(--acc)}
.noteIt .ft{display:flex;gap:6px;align-items:center;margin-top:7px;color:var(--tx2);font-size:.78em}
.noteIt .ft .spacer{flex:1}
.noteIt .ft button{min-height:24px;padding:1px 7px;font-size:1em;background:transparent;border-color:transparent}
.noteIt .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.noteclr-y{background:#FFD666}.noteclr-g{background:#7AD68C}.noteclr-b{background:#7AB2FF}.noteclr-p{background:#FF96C4}
/* 阅读总结 */
.sumGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:10px 0 16px}
.sumGrid .c{background:var(--card2);border-radius:10px;padding:10px 12px;min-height:66px}
.sumGrid .c b{display:block;font-size:1.18em;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumGrid .c span{color:var(--tx2);font-size:.78em;display:block;margin-top:2px}
.sumEx{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px}
.sumEx .e{padding:7px 0;border-bottom:1px dashed var(--line)}
.sumEx .e:last-child{border-bottom:none}
.sumEx .e .t{font-size:.9em;line-height:1.6}
.sumEx .e .n{color:var(--acc);font-size:.85em;margin-top:3px}
.sumEx .e .h{color:var(--tx2);font-size:.76em;margin-top:3px}
/* ---------- 翻页模式（分栏） ---------- */
/* 版心宽度限制放在容器上：容器居中、自己裁掉溢出；
   #page 铺满容器，多栏溢出的后续列被容器裁掉，翻页只靠 translateX。
   ⚠️ overflow:hidden 绝不能加在 #page 上——那会把平移过去的内容一起裁掉，
      翻到第 2 页之后整页空白。 */
html[data-mode="page"] #pageWrap{
  overflow:hidden;
  width:100%;
  max-width:calc(var(--pagew) * var(--pcols,1) + 60px * (var(--pcols,1) - 1));
  margin:0 auto;
}
html[data-mode="page"] #page{
  height:100%;min-height:0;margin:0;
  width:100%;max-width:none;
  overflow:visible;
  column-fill:auto;column-gap:60px;
  column-rule:1px solid rgba(128,128,128,.20);
  transform:translateX(0);will-change:transform;backface-visibility:hidden;
}
html[data-mode="page"] #page.pg-slide{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
html[data-mode="page"] #page.pg-fade{animation:pgFade .26s ease}
/* 版心是阅读器的地盘：书里的 body 样式会被映射到 #page 上，这里兜底钉死，
   否则一本书写 body{margin:5%} 就能把双栏挤出屏幕 */
html[data-mode] #page{margin:0 auto;padding:34px var(--padx) 70px;
  font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);
  font-weight:var(--fw,400);
  background:var(--paper);color:var(--paperTx)}
/* 翻页：上下留白统一走这里，底部多留一成行高，避免最后一行贴住工具栏 */
html[data-mode="page"] #page{padding:24px var(--padx) calc(24px + .9em)}
@keyframes pgFade{from{opacity:.30}to{opacity:1}}
html[data-mode="page"] #chEnd{break-inside:avoid}
/* 翻页模式：左右点击区提示 */
#pgHintL,#pgHintR{position:absolute;top:0;bottom:0;width:15%;pointer-events:none;opacity:0;transition:opacity .2s;z-index:5}
#pgHintL{left:0;background:linear-gradient(90deg,rgba(128,128,128,.16),transparent)}
#pgHintR{right:0;background:linear-gradient(270deg,rgba(128,128,128,.16),transparent)}
html[data-mode="page"] #pageWrap:hover #pgHintL,html[data-mode="page"] #pageWrap:hover #pgHintR{opacity:.55}
html[data-mode="scroll"] #pgHintL,html[data-mode="scroll"] #pgHintR{display:none}
/* ---------- 沉浸模式 ---------- */
#viewRead{position:relative}
body.imm #readTop,body.imm #readFoot{position:absolute;left:0;right:0;z-index:32;box-shadow:0 6px 26px rgba(0,0,0,.34)}
body.imm #readTop{top:0;transform:translateY(-102%);transition:transform .22s ease}
body.imm #readFoot{bottom:0;transform:translateY(102%);transition:transform .22s ease}
body.imm #readTop.peek,body.imm #readFoot.peek{transform:none}
body.imm #readMain{padding:0}
/* ---------- 亮度暗化 ---------- */
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:45;transition:opacity .18s}
/* ---------- 自动阅读胶囊 ---------- */
#autoPill{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:50;display:none;
  align-items:center;gap:8px;padding:7px 9px 7px 14px;border-radius:22px;font-size:.84em;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap}
#autoPill.on{display:flex}
#autoPill button{min-height:28px;padding:3px 10px;border-radius:14px}
#autoPill .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:6px}
/* 按钮上的状态点 */
#btnAuto.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* ---------- 排版面板 ---------- */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin:6px 0 12px}
.sw-grid .th{display:flex;flex-direction:column;gap:5px;align-items:center;padding:8px 4px;border-radius:10px;
  border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.78em;color:var(--tx2);min-height:56px}
.sw-grid .th.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sw-grid .th .sw{width:100%;height:22px;border-radius:6px;border:1px solid rgba(128,128,128,.35)}
.clrRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clrRow input[type=color]{width:34px;height:26px;min-height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--card)}
/* 字体选择：每个按钮用自己的字体渲染，挑之前先看到样子 */
.ffGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:5px;flex:1;min-width:220px}
.ffGrid button{padding:6px 4px;font-size:.92em}
/* 常用色板 */
.swRow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swDot{width:23px;height:23px;min-height:23px;padding:0;border-radius:50%;border:1px solid rgba(128,128,128,.45);cursor:pointer;flex:0 0 auto}
.swDot:hover{transform:scale(1.12)}
.swDot.on{box-shadow:0 0 0 2px var(--acc);border-color:transparent}
.tpGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px}
.tpGrid .cell{display:flex;flex-direction:column;gap:3px}
.tpGrid .cell .lb{font-size:.78em;color:var(--tx2)}
.tpGrid .cell .seg{flex-wrap:wrap}
.kbd{display:inline-block;min-width:22px;text-align:center;background:var(--card2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.86em;font-family:var(--ff)}
p.kv.kbdline{line-height:2.1}
/* ---------- 主题面板（卡片式预览） ---------- */
.thGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin:4px 0 14px}
.thCard{position:relative;display:flex;flex-direction:column;gap:5px;align-items:flex-start;
  padding:9px 10px;border-radius:11px;border:1px solid var(--line);cursor:pointer;
  text-align:left;font-size:.8em;line-height:1.3;overflow:hidden;min-height:74px}
.thCard b{font-size:.94em;opacity:.9}
.thCard .demo{font-size:.86em;opacity:.72;letter-spacing:.03em}
.thCard .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%}
.thCard .tick{position:absolute;right:8px;bottom:6px;font-size:.9em;font-weight:700;opacity:0}
.thCard.on{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}
.thCard.on .tick{opacity:1}
/* ---------- 阅读时钟 ---------- */
.clkBig{display:flex;align-items:baseline;gap:14px;padding:11px 15px;margin:2px 0 14px;border-radius:12px;
  background:var(--card2);border:1px solid var(--line)}
.clkBig b{font-size:1.7em;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clkBig span{font-size:.86em;color:var(--tx2)}
#clock{font-size:.76em;color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums;
  padding:3px 9px;border-radius:11px;background:var(--card2);border:1px solid var(--line);cursor:pointer;
  transition:color .2s,border-color .2s}
#clock:hover{color:var(--tx)}
#clock.warn{color:var(--warn);border-color:var(--warn)}
#clock.tired{color:var(--bad);border-color:var(--bad)}
#clock.off{display:none}
/* 沉浸模式顶栏收起，留一个淡时钟在右上角 */
#clockFloat{display:none;position:absolute;top:10px;right:14px;z-index:31;pointer-events:none;
  font-size:.74em;color:var(--tx2);font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:11px;
  background:rgba(0,0,0,.28);border:1px solid rgba(128,128,128,.28);opacity:.62}
body.imm #clockFloat{display:block}
/* ---------- 休息提醒 ---------- */
#restTip{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(14px);z-index:60;
  display:none;align-items:center;gap:10px;padding:11px 13px 11px 16px;border-radius:14px;font-size:.86em;
  background:var(--card2);border:1px solid var(--warn);box-shadow:0 18px 46px rgba(0,0,0,.62);max-width:min(92vw,560px)}
#restTip .rtTx{color:var(--tx);font-weight:500}
#restTip .ic{font-size:1.15em;margin-right:2px}
#restTip.on{display:flex;animation:restIn .24s ease forwards}
@keyframes restIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#restTip .rtTx{line-height:1.5}
#restTip button{min-height:30px;padding:4px 11px;border-radius:14px;white-space:nowrap}
/*__NARROW_CSS__*/

</style>
</head>

  <div id="selTools">
